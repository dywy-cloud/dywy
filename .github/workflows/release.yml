name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  milestone:
    types: [closed]

concurrency:
  group: release-${{ github.event.milestone.title || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.milestone.title || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v6

      # A pushed tag is released as is. Closing a milestone named X.Y.Z tags the head of the default
      # branch, unless that tag already exists (manual tag, or milestone closed again).
      # The tag filter is a loose glob: the strict X.Y.Z check happens here.
      - name: Resolve the release
        id: release
        run: |
          release=false
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              release=true
            elif ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
              git tag "$VERSION"
              git push origin "$VERSION"
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  publish-image:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: ghcr.io/${{ github.repository }}:${{ env.VERSION }}

