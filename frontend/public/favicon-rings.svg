<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="dywy.cloud">
  <defs>
    <linearGradient id="favRBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#788f9c" />
      <stop offset="1" stop-color="#37474f" />
    </linearGradient>
    <linearGradient id="favRRose" x1="0" y1="18" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e79aae" />
      <stop offset="1" stop-color="#cf6f88" />
    </linearGradient>
    <!-- weave window at the TOP crossing, square and proportional to R (matches icon.svg / avatar-social.svg ratio) -->
    <clipPath id="favRTopCross"><rect x="25.5" y="21.6" width="13" height="13" /></clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#favRBg)" />

  <g fill="none" stroke-width="6.3" stroke-linecap="round">
    <circle cx="24.2" cy="32" r="12" stroke="#f4f5f5" />
    <circle cx="39.8" cy="32" r="12" stroke="url(#favRRose)" />
    <g clip-path="url(#favRTopCross)"><circle cx="24.2" cy="32" r="12" stroke="#f4f5f5" /></g>
  </g>
</svg>


