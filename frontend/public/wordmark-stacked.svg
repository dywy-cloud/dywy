  <text x="80" y="120" text-anchor="middle" font-family="'Poppins','Segoe UI',system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#37474f">dywy</tspan><tspan fill="#cf6f88" font-weight="500">.cloud</tspan>
