<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="dywy.cloud">
  <defs>
    <linearGradient id="stBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#788f9c" />
      <stop offset="1" stop-color="#37474f" />
    </linearGradient>
    <linearGradient id="stRose" x1="0" y1="20" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e79aae" />
      <stop offset="1" stop-color="#cf6f88" />
    </linearGradient>
    <clipPath id="stRingTop"><rect x="29.5" y="45" width="5" height="5" /></clipPath>
