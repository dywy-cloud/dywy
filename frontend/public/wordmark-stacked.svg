  <g transform="translate(48 16)">
    <rect width="64" height="64" rx="15" fill="url(#stBg)" />
    <g font-family="'Poppins','Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" letter-spacing="-2" text-anchor="middle">
      <text x="32" y="34"><tspan fill="#f4f5f5">d</tspan><tspan fill="none">y</tspan><tspan fill="#f4f5f5">w</tspan><tspan fill="none">y</tspan></text>
      <text x="32" y="34"><tspan fill="none">d</tspan><tspan fill="url(#stRose)">y</tspan><tspan fill="none">w</tspan><tspan fill="url(#stRose)">y</tspan></text>
    </g>
    <g fill="none" stroke-width="2.4" stroke-linecap="round">
      <circle cx="29" cy="49" r="4.6" stroke="#f4f5f5" />
      <circle cx="35" cy="49" r="4.6" stroke="url(#stRose)" />
      <g clip-path="url(#stRingTop)"><circle cx="29" cy="49" r="4.6" stroke="#f4f5f5" /></g>
