name: Deploy prod on Docker

on:
  # The release tag (X.Y.Z) is the version to deploy; the mirror brings it from GitHub.
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  # Manual run, to test the runner without waiting for a mirror sync.
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to deploy (X.Y.Z)
        required: true

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest-forge
    permissions:
      contents: read
      packages: read
    steps:
      # The tag filter is a loose glob and the manual input is free text: the strict X.Y.Z check
      # happens here, before anything is checked out or deployed.
      - name: Validate the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' does not respect the X.Y.Z version template" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}

      # The tag reaches the mirror before GitHub has finished publishing the image: wait for it.
      - name: Wait for the image on GHCR
        env:
          IMAGE: ghcr.io/dywy-cloud/dywy:${{ env.VERSION }}
        run: |
          for attempt in $(seq 1 60); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Image $IMAGE is available"
              exit 0
            fi
            echo "Image $IMAGE not published yet (attempt $attempt/60), retrying in 30s"
            sleep 30
          done
          echo "Image $IMAGE still missing after 30 minutes" >&2
          exit 1

      - name: Deploy to docker host
      # Script docker compose up
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          echo "Version : ${VERSION}"
          echo "SHA : ${EXPECTED_SHA}"
          echo "API URL : ${GH_API_URL}"
          docker run hello-world 
