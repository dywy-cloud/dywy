name: Deploy prod on Docker

on:
  # The release tag (X.Y.Z) is the version to deploy; the mirror brings it from GitHub.
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  # Manual run, to test the runner without waiting for a mirror sync: pick the release tag
  # (X.Y.Z) as the run ref in the dialog. The tag must contain this workflow file (tags cut before
  # it was merged do not) and a branch is rejected by the version validation.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest-forge
    steps:
      # The tag filter is a loose glob and the manual input is free text: the strict X.Y.Z check
      # happens here, before anything is checked out or deployed.
      - name: Validate the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' does not respect the X.Y.Z version template" >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}

      # The tag reaches the mirror before GitHub has finished publishing the image: wait for it.
      - name: Wait for the image on GHCR
        env:
          IMAGE: ghcr.io/dywy-cloud/dywy:${{ env.VERSION }}
        run: |
          for attempt in $(seq 1 60); do
            if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
              echo "Image $IMAGE is available"
              exit 0
            fi
            echo "Image $IMAGE not published yet (attempt $attempt/60), retrying in 30s"
            sleep 30
          done
          echo "Image $IMAGE still missing after 30 minutes" >&2
          exit 1

      - name: Deploy to docker host
        env:
          APP_IMAGE_TAG: ${{ env.VERSION }}
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID }}
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET }}
          APP_AUTH_ADMIN_EMAILS: ${{ vars.APP_AUTH_ADMIN_EMAILS }}
          APP_AUTH_READ_ONLY_EMAILS: ${{ vars.APP_AUTH_READ_ONLY_EMAILS }}
          APP_AUTH_SUCCESS_REDIRECT_URL: ${{ vars.APP_AUTH_SUCCESS_REDIRECT_URL }}
          APP_CORS_ALLOWED_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS }}
          APP_GUEST_ACCESS_BASE_URL: ${{ vars.APP_GUEST_ACCESS_BASE_URL }}
          APP_GUEST_AREA_URL: ${{ vars.APP_GUEST_AREA_URL }}
          APP_GUEST_ACCESS_JWT_SECRET: ${{ secrets.APP_GUEST_ACCESS_JWT_SECRET }}
          APP_MAIL_FROM: ${{ vars.APP_MAIL_FROM }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          APP_DEEZER_ACCESS_TOKEN: ${{ secrets.APP_DEEZER_ACCESS_TOKEN }}
          APP_DEEZER_PLAYLIST_ID: ${{ vars.APP_DEEZER_PLAYLIST_ID }}
        run: |
          umask 077
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          emit() {
            local name="$1" value="${!1}"
            case "$value" in
              *\'* | *$'\n'*)
                echo "$name contains a single quote or a newline, which cannot be written to the env file" >&2
                exit 1
                ;;
            esac
            printf "%s='%s'\n" "$name" "$value" >> "$ENV_FILE"
          }

          for name in APP_IMAGE_TAG DOMAIN ACME_EMAIL POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
            SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID \
            SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET \
            APP_AUTH_ADMIN_EMAILS APP_AUTH_READ_ONLY_EMAILS APP_AUTH_SUCCESS_REDIRECT_URL \
            APP_CORS_ALLOWED_ORIGINS APP_GUEST_ACCESS_BASE_URL APP_GUEST_AREA_URL \
            APP_GUEST_ACCESS_JWT_SECRET APP_MAIL_FROM BREVO_API_KEY BREVO_SENDER_NAME \
            APP_DEEZER_ACCESS_TOKEN APP_DEEZER_PLAYLIST_ID; do
            emit "$name"
          done

          echo "Deploying dywy ${VERSION}"
          docker compose -p dywy --env-file "$ENV_FILE" -f docker-compose.prod.yml pull
          docker compose -p dywy --env-file "$ENV_FILE" -f docker-compose.prod.yml up -d --remove-orphans --wait
          docker compose -p dywy --env-file "$ENV_FILE" -f docker-compose.prod.yml ps
